<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - ShopSphere</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="images/logo/Picsart_26-02-11_17-00-14-844.png">
</head>
<body>
    <header class="header">
        <nav class="navbar">
            <div class="nav-container">
                <div class="nav-left">
                    <a href="index.html" class="logo" style="text-decoration: none;">
                        <img class="logo-img" src="images/logo/Picsart_26-02-11_17-00-14-844.png" alt="ShopSphere logo">
                        <span class="logo-text">ShopSphere</span>
                    </a>
                </div>
                <div class="nav-right">
                    <button class="nav-btn cart-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M9 2 3 9v13a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9l-6-7z"></path>
                            <line x1="3" y1="9" x2="21" y2="9"></line>
                            <path d="M9 22V12h6v10"></path>
                        </svg>
                        <span>Cart</span>
                        <span class="cart-count">0</span>
                    </button>
                </div>
            </div>
        </nav>
    </header>

    <main class="product-detail-page">
        <div class="container">
            <div class="breadcrumb" id="breadcrumb" style="margin: 20px 0; color: #565959; font-size: 14px;">
                <a href="index.html" style="color: #565959; text-decoration: none;">Home</a> &gt; <span id="category-crumb">Category</span> &gt; <span id="product-crumb" style="color: #C7511F; font-weight: 700;">Product</span>
            </div>

            <div class="product-grid-layout">
                <!-- Left: Gallery -->
                <div class="product-gallery">
                    <div class="thumbnail-list" id="thumbnail-list">
                        <!-- Thumbnails injected via JS -->
                    </div>
                    <div class="main-image-container">
                        <img id="main-image" src="" alt="Product Image">
                    </div>
                </div>

                <!-- Middle: Info -->
                <div class="product-center-info">
                    <h1 id="product-title" class="pd-title"></h1>
                    <div class="pd-rating">
                        <div class="stars" id="pd-stars"></div>
                        <span class="rating-count" id="pd-reviews"></span>
                    </div>
                    <div class="pd-divider"></div>
                    <div class="pd-price-block">
                        <span class="price-label">Price:</span>
                        <span class="pd-price-symbol">$</span>
                        <span class="pd-price-whole" id="pd-price"></span>
                    </div>
                    <div class="pd-divider"></div>
                    <div class="pd-description">
                        <h3>About this item</h3>
                        <ul id="pd-features">
                            <!-- Features injected via JS -->
                        </ul>
                    </div>
                </div>

                <!-- Right: Buy Box -->
                <div class="product-buy-box">
                    <div class="buy-box-price" id="buy-box-price"></div>
                    <div class="buy-box-delivery">
                        FREE delivery <b id="delivery-date"></b>
                    </div>
                    <div class="buy-box-stock" id="stock-status">In Stock</div>
                    <div class="buy-box-actions">
                        <div class="quantity-selector">
                            <label>Qty:</label>
                            <select id="qty-select">
                                <option>1</option>
                                <option>2</option>
                                <option>3</option>
                                <option>4</option>
                                <option>5</option>
                            </select>
                        </div>
                        <button class="btn-primary full-width" id="add-to-cart-btn">Add to Cart</button>
                        <button class="btn-secondary full-width" id="buy-now-btn">Buy Now</button>
                    </div>
                    <div class="secure-transaction">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                        Secure transaction
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Image Zoom Modal -->
    <div id="image-zoom-modal" class="zoom-modal">
        <div class="zoom-modal-content">
            <span class="close-modal">&times;</span>
            <div class="zoom-body">
                <div class="zoom-main-area">
                    <div class="zoom-controls">
                        <button id="zoom-in-btn" class="zoom-btn"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="11" y1="8" x2="11" y2="14"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg></button>
                        <button id="zoom-out-btn" class="zoom-btn"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg></button>
                    </div>
                    <div class="zoom-viewport">
                        <img id="zoom-main-image" src="" alt="Zoomed Product">
                    </div>
                </div>
                <div class="zoom-sidebar">
                    <h3 id="zoom-product-title"></h3>
                    <div class="zoom-thumbnails" id="zoom-thumbnail-list"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
