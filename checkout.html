    <style>
    :root {
      --ck-bg: #ffffff;
      --ck-panel: #f8fafc;
      --ck-border: #e2e8f0;
      --ck-text: #0f172a;
      --ck-muted: #64748b;
      --ck-primary: #3b82f6;
      --ck-primary-dark: #2563eb;
      --ck-success: #10b981;
      --ck-danger: #ef4444;
      --ck-warning: #f59e0b;
      --ck-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --ck-shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --ck-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --ck-shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      --ck-shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--ck-gradient);
      color: var(--ck-text);
      line-height: 1.6;
      min-height: 100vh;
    }

    /* Header */
    .checkout-header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--ck-border);
  z-index: 1000;
  box-shadow: var(--ck-shadow-sm);
}

.checkout-header .nav-container {
  max-width: 1280px;
  margin: 0 auto;
  padding: 1rem 1.5rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.checkout-header .logo {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  font-weight: 700;
  font-size: 1.5rem;
  color: var(--ck-primary);
  text-decoration: none;
  transition: transform 0.2s ease;
}

.checkout-header .logo:hover {
  transform: translateY(-1px);
}

.checkout-header .logo-img {
  height: 48px;
  width: auto;
  display: block;
  border-radius: 12px;
}

.checkout-header .logo-text {
  font-weight: 700;
  color: var(--ck-primary);
}

.checkout-container {
  max-width: 1280px;
  margin: 120px auto 40px;
  padding: 0 1.5rem;
  display: grid;
  grid-template-columns: 1.6fr 1fr;
  gap: 2.5rem;
  animation: fadeInUp 0.6s ease-out;
}

@keyframes fadeInUp {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.ck-card {
  background: var(--ck-bg);
  border: 1px solid var(--ck-border);
  border-radius: 20px;
  box-shadow: var(--ck-shadow-lg);
  overflow: hidden;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.ck-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--ck-shadow-xl);
}

/* Modern Progress Indicator */
.progress-indicator {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 2rem 2rem 1rem;
  position: relative;
}

.progress-step {
  display: flex;
  flex-direction: column;
  align-items: center;
  flex: 1;
  position: relative;
  z-index: 2;
}

.progress-step::before {
  content: '';
  position: absolute;
  top: 20px;
  left: 50%;
  right: -50%;
  height: 2px;
  background: var(--ck-border);
  z-index: -1;
}

.progress-step:last-child::before {
  display: none;
}

.progress-step.active::before {
  background: var(--ck-primary);
}

.progress-circle {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: var(--ck-panel);
  border: 2px solid var(--ck-border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 600;
  font-size: 0.9rem;
  color: var(--ck-muted);
  transition: all 0.3s ease;
  margin-bottom: 0.5rem;
}

.progress-step.active .progress-circle {
  background: var(--ck-primary);
  border-color: var(--ck-primary);
  color: white;
  transform: scale(1.1);
  box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
}

.progress-step.completed .progress-circle {
  background: var(--ck-success);
  border-color: var(--ck-success);
  color: white;
}

.progress-label {
  font-size: 0.85rem;
  font-weight: 500;
  color: var(--ck-muted);
  text-align: center;
}

.progress-step.active .progress-label {
  color: var(--ck-primary);
  font-weight: 600;
}

.progress-step.completed .progress-label {
  color: var(--ck-success);
}

.ck-section {
  padding: 2rem;
  border-bottom: 1px solid var(--ck-border);
  position: relative;
}

.ck-section:last-child {
  border-bottom: none;
}

.ck-title {
  font-size: 1.25rem;
  font-weight: 700;
  color: var(--ck-text);
  margin-bottom: 1.5rem;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.ck-title::before {
  content: '';
  width: 4px;
  height: 24px;
  background: var(--ck-gradient);
  border-radius: 2px;
}

.ck-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1.5rem;
  margin-bottom: 1.5rem;
}

.ck-input {
  position: relative;
}

/* Floating Label Inputs */
.floating-label {
  position: relative;
}

.floating-label input,
.floating-label select {
  width: 100%;
  border: 2px solid var(--ck-border);
  border-radius: 12px;
  padding: 1rem 0.9rem;
  font-size: 0.95rem;
  color: var(--ck-text);
  background: var(--ck-bg);
  outline: none;
  transition: all 0.3s ease;
}

.floating-label label {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 0.95rem;
  color: var(--ck-muted);
  pointer-events: none;
  transition: all 0.3s ease;
  background: var(--ck-bg);
  padding: 0 4px;
}

.floating-label input:focus,
.floating-label select:focus,
.floating-label input:not(:placeholder-shown),
.floating-label select:valid {
  border-color: var(--ck-primary);
  box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
}

.floating-label input:focus + label,
.floating-label input:not(:placeholder-shown) + label,
.floating-label select:focus + label,
.floating-label select:valid + label {
  top: 0;
  font-size: 0.8rem;
  color: var(--ck-primary);
  font-weight: 500;
}

.floating-label input.error,
.floating-label select.error {
  border-color: var(--ck-danger);
  box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.1);
}

.floating-label input.error + label,
.floating-label select.error + label {
  color: var(--ck-danger);
}

.floating-label input.success,
.floating-label select.success {
  border-color: var(--ck-success);
  box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1);
}

.ck-error {
  position: absolute;
  bottom: -20px;
  left: 12px;
  font-size: 0.8rem;
  color: var(--ck-danger);
  font-weight: 500;
  opacity: 0;
  transform: translateY(-5px);
  transition: all 0.3s ease;
}

.ck-error.show {
  opacity: 1;
  transform: translateY(0);
}

/* Radio Buttons */
.ck-radio {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}

.option {
  display: flex;
  align-items: center;
  padding: 1rem 1.25rem;
  border: 2px solid var(--ck-border);
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.3s ease;
  background: var(--ck-bg);
}

.option:hover {
  border-color: var(--ck-primary);
  background: rgba(59, 130, 246, 0.02);
}

.option input[type="radio"] {
  margin-right: 1rem;
  width: 18px;
  height: 18px;
  accent-color: var(--ck-primary);
}

.option input[type="radio"]:checked + span {
  color: var(--ck-primary);
  font-weight: 600;
}

.option input[type="radio"]:checked ~ .option-price {
  color: var(--ck-primary);
  font-weight: 600;
}

.option span {
  flex: 1;
  font-weight: 500;
  color: var(--ck-text);
}

.option-price {
  font-weight: 600;
  color: var(--ck-muted);
}

/* Order Summary */
.summary-card {
  background: var(--ck-bg);
  border: 1px solid var(--ck-border);
  border-radius: 20px;
  padding: 2rem;
  box-shadow: var(--ck-shadow-lg);
  position: sticky;
  top: 120px;
  max-height: calc(100vh - 140px);
  overflow-y: auto;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.summary-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--ck-shadow-xl);
}

.summary-title {
  font-size: 1.25rem;
  font-weight: 700;
  color: var(--ck-text);
  margin-bottom: 1.5rem;
  padding-bottom: 1rem;
  border-bottom: 2px solid var(--ck-border);
}

.summary-items {
  max-height: 300px;
  overflow-y: auto;
  margin-bottom: 1.5rem;
}

.summary-item {
  display: flex;
  align-items: center;
  padding: 1rem;
  border-radius: 12px;
  background: var(--ck-panel);
  margin-bottom: 0.75rem;
  transition: all 0.3s ease;
}

.summary-item:hover {
  background: rgba(59, 130, 246, 0.05);
  transform: translateX(4px);
}

.summary-item img {
  width: 60px;
  height: 60px;
  object-fit: cover;
  border-radius: 8px;
  margin-right: 1rem;
}

.summary-meta {
  flex: 1;
}

.summary-meta div {
  font-weight: 500;
  color: var(--ck-text);
  margin-bottom: 0.25rem;
}

.summary-price {
  color: var(--ck-muted);
  font-size: 0.9rem;
}

.summary-totals {
  border-top: 2px solid var(--ck-border);
  padding-top: 1rem;
}

.summary-line {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0.75rem 0;
  color: var(--ck-muted);
  font-size: 0.95rem;
}

.summary-total {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-weight: 800;
  font-size: 1.25rem;
  color: var(--ck-text);
  padding: 1rem 0;
  border-top: 2px solid var(--ck-border);
  margin-top: 0.5rem;
}

.secure-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  margin-top: 1.5rem;
  padding: 1rem;
  background: rgba(16, 185, 129, 0.1);
  border-radius: 12px;
  color: var(--ck-success);
  font-size: 0.9rem;
  font-weight: 500;
}

/* Place Order Button */
.place-order {
  width: 100%;
  margin-top: 1.5rem;
  padding: 1.25rem;
  background: var(--ck-gradient);
  color: white;
  border: none;
  border-radius: 12px;
  font-size: 1.1rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.3s ease;
  position: relative;
  overflow: hidden;
}

.place-order::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
  transition: left 0.5s ease;
}

.place-order:hover::before {
  left: 100%;
}

.place-order:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(59, 130, 246, 0.3);
}

.place-order:active {
  transform: translateY(0);
}

.place-order.loading {
  opacity: 0.7;
  pointer-events: none;
}

.place-order.loading::after {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  width: 20px;
  height: 20px;
  margin: -10px 0 0 -10px;
  border: 2px solid rgba(255, 255, 255, 0.3);
  border-top: 2px solid white;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

.order-status {
  text-align: center;
  margin-top: 1rem;
  font-weight: 500;
  font-size: 0.95rem;
  padding: 0.75rem;
  border-radius: 8px;
  transition: all 0.3s ease;
}

.order-status.success {
  background: rgba(16, 185, 129, 0.1);
  color: var(--ck-success);
}

.order-status.error {
  background: rgba(239, 68, 68, 0.1);
  color: var(--ck-danger);
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

/* Responsive Design */
@media (max-width: 1024px) {
  .checkout-container {
    grid-template-columns: 1fr;
    gap: 2rem;
  }
  
  .summary-card {
    position: relative;
    top: 0;
    max-height: none;
  }
  
  .progress-indicator {
    padding: 1.5rem 1rem;
  }
  
  .progress-label {
    font-size: 0.75rem;
  }
  
  .ck-row {
    grid-template-columns: 1fr;
    gap: 1rem;
  }
}

@media (max-width: 640px) {
  .checkout-header .nav-container {
    padding: 0.75rem 1rem;
  }
  
  .checkout-header .logo {
    font-size: 1.25rem;
  }
  
  .checkout-header .logo-img {
    height: 36px;
  }
  
  .checkout-container {
    margin: 100px auto 30px;
    padding: 0 1rem;
  }
  
  .ck-section {
    padding: 1.5rem;
  }
  
  .summary-card {
    padding: 1.5rem;
  }
  
  .progress-circle {
    width: 32px;
    height: 32px;
    font-size: 0.8rem;
  }
  
  .progress-label {
    font-size: 0.7rem;
  }
  
  .place-order {
    padding: 1rem;
    font-size: 1rem;
  }
}

/* Animations */
@keyframes slideIn {
  from { transform: translateX(100%); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}

@keyframes slideOut {
  from { transform: translateX(0); opacity: 1; }
  to { transform: translateX(100%); opacity: 0; }
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

/* Scrollbar Styling */
.summary-items::-webkit-scrollbar {
  width: 6px;
}

.summary-items::-webkit-scrollbar-track {
  background: var(--ck-panel);
  border-radius: 3px;
}

.summary-items::-webkit-scrollbar-thumb {
  background: var(--ck-border);
  border-radius: 3px;
}

.summary-items::-webkit-scrollbar-thumb:hover {
  background: var(--ck-muted);
}
</style>

      <div class="ck-row">
        <div class="floating-label">
          <input id="email" type="email" placeholder=" ">
          <label for="email">Email Address</label>
          <div class="ck-error" id="emailError"></div>
        </div>
        <div class="floating-label">
          <input id="phone" type="tel" placeholder=" ">
          <label for="phone">Phone Number</label>
          <div class="ck-error" id="phoneError"></div>
        </div>
      </div>
    </div>

    <div class="ck-section" id="section-shipping">
      <div class="ck-title">Shipping Address</div>
      <div class="ck-row">
        <div class="floating-label">
          <input id="firstName" type="text" placeholder=" ">
          <label for="firstName">First Name</label>
          <div class="ck-error" id="firstNameError"></div>
        </div>
        <div class="floating-label">
          <input id="lastName" type="text" placeholder=" ">
          <label for="lastName">Last Name</label>
          <div class="ck-error" id="lastNameError"></div>
        </div>
      </div>
      <div class="floating-label">
        <input id="address1" type="text" placeholder=" ">
        <label for="address1">Address Line 1</label>
        <div class="ck-error" id="address1Error"></div>
      </div>
      <div class="floating-label">
        <input id="address2" type="text" placeholder=" ">
        <label for="address2">Address Line 2 (Optional)</label>
      </div>
      <div class="ck-row">
        <div class="floating-label">
          <input id="city" type="text" placeholder=" ">
          <label for="city">City</label>
          <div class="ck-error" id="cityError"></div>
        </div>
        <div class="floating-label">
          <select id="state">
            <option value="">Select State</option>
            <option value="Maharashtra">Maharashtra</option>
            <option value="Karnataka">Karnataka</option>
            <option value="Delhi">Delhi</option>
            <option value="Gujarat">Gujarat</option>
            <option value="Tamil Nadu">Tamil Nadu</option>
          </select>
          <label for="state">State</label>
          <div class="ck-error" id="stateError"></div>
        </div>
      </div>
      <div class="ck-row">
        <div class="floating-label">
          <input id="zip" type="text" placeholder=" ">
          <label for="zip">Postal Code</label>
          <div class="ck-error" id="zipError"></div>
        </div>
        <div class="floating-label">
          <input id="country" type="text" value="India" readonly>
          <label for="country">Country</label>
        </div>
      </div>
      
      <div class="ck-title" style="margin-top: 2rem;">Shipping Method</div>
      <div class="ck-radio">
        <label class="option">
          <input type="radio" name="ship" value="standard" checked>
          <span>Standard Delivery</span>
          <span class="option-price">₹80.00</span>
        </label>
        <label class="option">
          <input type="radio" name="ship" value="express">
          <span>Express Delivery</span>
          <span class="option-price">₹180.00</span>
        </label>
      </div>
    </div>

    <div class="ck-section" id="section-payment">
      <div class="ck-title">Payment Details</div>
      <div class="ck-row">
        <div class="floating-label">
          <input id="cardName" type="text" placeholder=" ">
          <label for="cardName">Name on Card</label>
          <div class="ck-error" id="cardNameError"></div>
        </div>
      </div>
      <div class="floating-label">
        <input id="cardNumber" type="text" placeholder=" ">
        <label for="cardNumber">Card Number</label>
        <div class="ck-error" id="cardNumberError"></div>
      </div>
      <div class="ck-row">
        <div class="floating-label">
          <input id="expiry" type="text" placeholder=" ">
          <label for="expiry">Expiry Date (MM/YY)</label>
          <div class="ck-error" id="expiryError"></div>
        </div>
        <div class="floating-label">
          <input id="cvv" type="text" placeholder=" ">
          <label for="cvv">CVV</label>
          <div class="ck-error" id="cvvError"></div>
        </div>
      </div>
    </div>
  </section>

  <aside class="summary-card">
    <div class="summary-title">Order Summary</div>
    <div class="summary-items" id="summaryItems"></div>
    <div class="summary-totals">
      <div class="summary-line"><span>Subtotal</span><span id="subtotal">₹0.00</span></div>
      <div class="summary-line"><span>Shipping</span><span id="shipping">₹0.00</span></div>
      <div class="summary-line"><span>Tax</span><span id="tax">₹0.00</span></div>
      <div class="summary-total"><span>Total</span><span id="total">₹0.00</span></div>
    </div>
    <div class="secure-row">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"></path><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
      <span>SSL encrypted payment</span>
    </div>
    <button class="place-order" id="placeOrderBtn">Place Order</button>
    <div class="order-status" id="orderStatus"></div>
  </aside>
</main>
<div class="order-modal" id="orderModal">
  <div class="order-card">
    <div class="order-icon">✓</div>
    <div class="ck-title">Order Placed</div>
    <div class="order-id" id="orderId"></div>
    <div class="order-total">Total: <span id="orderTotal">₹0.00</span></div>
    <div class="order-actions">
      <button class="order-btn" id="orderHomeBtn">Continue Shopping</button>
      <button class="order-btn secondary" id="orderCloseBtn">Close</button>
    </div>
  </div>
</div>
<script src="js/checkout.js"></script>
</body>
</html>
